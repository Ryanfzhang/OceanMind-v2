[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oceanmind"
version = "0.1.5"
description = "Multi-agent ocean science research workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "novix-science" },
]

dependencies = [
    "deepagents~=0.7.6",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-openai>=1.2",
    "langchain-anthropic>=1.5",
    "langchain-deepseek>=1.1",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    # Keep desktop sidecar builds on a wheel-backed release; cryptography 50
    # currently falls back to a Rust source build on our macOS x86_64 target.
    "cryptography>=46,<50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
ocean-core = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "xarray>=2024.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "h5py>=3.10",
    "h5netcdf>=1.3",
]
ocean-zarr = [
    "zarr>=2.18,<4",
    "fsspec>=2024.2",
]
ocean-runtime = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "xarray>=2024.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "h5py>=3.10",
    "h5netcdf>=1.3",
    "zarr>=2.18,<4",
    "fsspec>=2024.2",
    "dask[array]>=2024.2",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "netCDF4>=1.6",
    "cartopy>=0.23",
    "gsw>=3.6",
]
ocean-maps = [
    "cartopy>=0.23",
    "pyproj>=3.6",
]
ocean-physics = [
    "gsw>=3.6",
]
desktop-build = [
    "pyinstaller>=6.12",
]

[project.scripts]
ocean = "oceanx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oceanx"]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
